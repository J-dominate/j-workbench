<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>J · 个人工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233B82F6'/%3E%3Ctext x='50%25' y='55%25' text-anchor='middle' fill='%23fff' font-family='Arial' font-size='18' font-weight='bold'%3EJ%3C/text%3E%3C/svg%3E">
<style>
  /* ============== 极简浅色主题 ============== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
                 "Hiragino Sans GB", "Source Han Sans CN", sans-serif;
    background: #F5F6F8;
    color: #1F2937;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea, select { font-family: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }

  :root {
    --bg-0: #F5F6F8;
    --bg-1: #FFFFFF;
    --bg-2: #FFFFFF;
    --bg-3: #FFFFFF;
    --bg-hover: #F1F3F6;
    --border: rgba(17,24,39,0.08);
    --border-strong: rgba(17,24,39,0.14);
    --text: #1F2937;
    --text-2: #6B7280;
    --text-3: #9CA3AF;
    --accent: #3B82F6;
    --accent-2: #8B5CF6;
    --accent-soft: rgba(59,130,246,0.10);
    --danger: #EF4444;
    --success: #10B981;
    --warning: #F59E0B;
    --purple: #7C3AED;
    --pink: #EC4899;
    --radius: 14px;
    --radius-sm: 10px;
    --shadow: 0 1px 2px rgba(17,24,39,0.04), 0 4px 16px rgba(17,24,39,0.04);
  }

  .app { display: grid; grid-template-columns: 230px 1fr; height: 100vh; width: 100vw; }

  /* ============== 侧边栏（桌面） ============== */
  .sidebar {
    background: #FFFFFF;
    border-right: 1px solid var(--border);
    padding: 26px 14px;
    display: flex; flex-direction: column;
    overflow-y: auto;
  }
  .brand {
    display: flex; align-items: baseline; gap: 6px;
    padding: 4px 12px 22px; font-weight: 700; font-size: 18px; letter-spacing: 0.3px;
  }
  .brand .dot { color: var(--accent); font-size: 22px; line-height: 1; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 11px;
    padding: 11px 13px; border-radius: 10px;
    color: var(--text-2); font-size: 14px; user-select: none;
    transition: background 0.15s, color 0.15s;
  }
  .nav-item:hover { background: var(--bg-hover); color: var(--text); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav-item .ico { width: 18px; text-align: center; font-size: 15px; }
  .sidebar .footer {
    margin-top: auto; padding: 12px; color: var(--text-3); font-size: 11px; line-height: 1.6;
  }

  /* ============== 主区 ============== */
  .main { overflow-y: auto; padding: 40px 52px 90px; }
  .main::-webkit-scrollbar { width: 8px; }
  .main::-webkit-scrollbar-thumb { background: rgba(17,24,39,0.12); border-radius: 4px; }

  /* ----- 主页问候 ----- */
  .greeting { text-align: center; margin: 26px 0 48px; }
  .greeting .name {
    font-size: 30px; font-weight: 700; color: var(--text);
    cursor: pointer; display: inline-block; padding: 2px 10px;
    border-radius: 8px; transition: background 0.15s;
  }
  .greeting .name:hover { background: var(--bg-hover); }
  .greeting .slogan {
    margin-top: 8px; font-size: 42px; font-weight: 800;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; letter-spacing: 3px; cursor: pointer;
    display: inline-block; padding: 4px 14px; border-radius: 10px;
    transition: filter 0.15s;
  }
  .greeting .slogan:hover { filter: brightness(1.05); }

  .section { margin-bottom: 30px; }
  .section-title {
    font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px;
    margin-bottom: 14px; color: var(--text);
  }
  .section-title .ico { color: var(--accent); }
  .section-title .actions { margin-left: auto; display: flex; gap: 8px; }
  .card {
    background: var(--bg-2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow);
  }

  /* ----- 倒数日 ----- */
  .countdown-list { display: flex; flex-direction: column; gap: 12px; }
  .countdown-row {
    display: flex; align-items: center; gap: 26px;
    padding: 18px 22px; background: var(--bg-3);
    border-radius: var(--radius-sm); border: 1px solid var(--border);
  }
  .countdown-num {
    font-size: 44px; font-weight: 800; color: var(--accent);
    min-width: 92px; text-align: right; line-height: 1;
  }
  .countdown-info { flex: 1; min-width: 0; }
  .countdown-info .title { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .countdown-info .date { font-size: 13px; color: var(--text-2); }
  .countdown-info .date.passed { color: var(--danger); }
  .countdown-info .days-label { display: inline-block; margin-left: 4px; color: var(--text-3); font-size: 12px; }
  .countdown-row .del {
    color: var(--danger); opacity: 0.55; font-size: 16px; padding: 6px 10px;
    border-radius: 6px; transition: opacity 0.15s, background 0.15s;
  }
  .countdown-row .del:hover { opacity: 1; background: rgba(239,68,68,0.08); }
  .countdown-add {
    display: flex; gap: 10px; margin-top: 14px; padding: 14px;
    background: var(--bg-3); border-radius: var(--radius-sm);
    border: 1px dashed var(--border-strong);
  }
  .countdown-add input {
    flex: 1; background: var(--bg-1); border: 1px solid var(--border);
    padding: 10px 12px; border-radius: 8px; color: var(--text); outline: none; font-size: 14px;
  }
  .countdown-add input:focus { border-color: var(--accent); }
  .countdown-add input[type="text"] { flex: 2; }

  /* ----- 功能概览 ----- */
  .feature-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .feature-card {
    background: var(--bg-3); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 22px 18px; cursor: pointer; min-height: 120px;
    display: flex; flex-direction: column; transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
  }
  .feature-card:hover { transform: translateY(-3px); border-color: var(--border-strong); box-shadow: var(--shadow); }
  .feature-card .icon { font-size: 28px; margin-bottom: 14px; line-height: 1; }
  .feature-card .name { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .feature-card .desc { font-size: 12px; color: var(--text-2); }
  .feature-card.miss .icon { color: var(--accent); }
  .feature-card.capture .icon { color: var(--warning); }
  .feature-card.countdown .icon { color: var(--accent); }
  .feature-card.habit .icon { color: var(--success); }
  .feature-card.news .icon { color: var(--purple); }
  .feature-card.replay .icon { color: var(--pink); }
  .feature-card.media .icon { color: var(--danger); }

  /* ============== 详情页 ============== */
  .page-head { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
  .page-head .big-icon {
    width: 56px; height: 56px; border-radius: 14px; background: var(--bg-3);
    display: flex; align-items: center; justify-content: center; font-size: 26px; border: 1px solid var(--border);
  }
  .page-head h1 { font-size: 26px; font-weight: 700; }
  .page-sub { color: var(--text-2); font-size: 14px; margin-bottom: 26px; margin-left: 70px; }
  .toolbar {
    display: flex; gap: 10px; margin-bottom: 18px; align-items: center;
    background: var(--bg-3); padding: 12px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .toolbar input, .toolbar select, .toolbar textarea {
    background: var(--bg-1); border: 1px solid var(--border); padding: 9px 12px;
    border-radius: 8px; color: var(--text); outline: none; font-size: 14px;
  }
  .toolbar input:focus, .toolbar select:focus, .toolbar textarea:focus { border-color: var(--accent); }
  .btn {
    padding: 9px 16px; border-radius: 8px; background: var(--accent); color: #fff;
    font-weight: 600; font-size: 14px; transition: filter 0.15s, transform 0.15s; white-space: nowrap;
  }
  .btn:hover { filter: brightness(1.05); }
  .btn:active { transform: scale(0.97); }
  .btn-ghost { background: transparent; color: var(--text-2); border: 1px solid var(--border-strong); }
  .btn-ghost:hover { background: var(--bg-hover); color: var(--text); }
  .btn-danger { background: rgba(239,68,68,0.10); color: var(--danger); }
  .btn-danger:hover { background: rgba(239,68,68,0.16); }

  .item-list { display: flex; flex-direction: column; gap: 8px; }
  .item {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    background: var(--bg-3); border: 1px solid var(--border); border-radius: 10px; transition: border-color 0.15s;
  }
  .item:hover { border-color: var(--border-strong); }
  .item.done { opacity: 0.5; }
  .item.done .item-text { text-decoration: line-through; }
  .item .checkbox {
    width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--border-strong);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: all 0.15s; cursor: pointer; color: transparent; font-size: 12px; font-weight: 700;
  }
  .item.done .checkbox { background: var(--success); border-color: var(--success); color: #fff; }
  .item .item-main { flex: 1; min-width: 0; }
  .item .item-text { font-size: 14px; color: var(--text); word-break: break-word; }
  .item .item-meta { font-size: 12px; color: var(--text-3); margin-top: 2px; }
  .item .item-actions { display: flex; gap: 4px; }
  .item .icon-btn {
    color: var(--text-3); padding: 4px 8px; border-radius: 6px; font-size: 14px;
    transition: color 0.15s, background 0.15s;
  }
  .item .icon-btn:hover { color: var(--text); background: var(--bg-hover); }
  .item .icon-btn.del:hover { color: var(--danger); background: rgba(239,68,68,0.08); }

  .empty { text-align: center; color: var(--text-3); padding: 40px 20px; font-size: 14px; }
  .empty .big { font-size: 36px; margin-bottom: 8px; opacity: 0.4; }

  /* 今日任务时间轴 */
  .task-row { display: grid; grid-template-columns: 80px 1fr auto; gap: 12px; align-items: center; }
  .task-row .time { color: var(--accent); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; text-align: right; }
  .task-row .text-input {
    background: var(--bg-1); border: 1px solid var(--border); padding: 9px 12px;
    border-radius: 8px; color: var(--text); outline: none; font-size: 14px; width: 100%;
  }
  .task-row .text-input:focus { border-color: var(--accent); }

  /* 习惯打卡 */
  .habit-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .habit-card {
    background: var(--bg-3); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px; display: flex; align-items: center; gap: 14px;
  }
  .habit-card .emoji { font-size: 30px; line-height: 1; }
  .habit-card .h-info { flex: 1; }
  .habit-card .h-name { font-size: 15px; font-weight: 600; color: var(--text); }
  .habit-card .h-meta { font-size: 12px; color: var(--text-2); margin-top: 2px; }
  .habit-card .h-check {
    width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--border-strong);
    display: flex; align-items: center; justify-content: center; font-size: 16px; color: transparent;
    cursor: pointer; transition: all 0.18s; flex-shrink: 0;
  }
  .habit-card .h-check.done { background: var(--success); border-color: var(--success); color: #fff; }

  /* 信息日报 */
  .news-block { padding: 14px 16px; }
  .news-block .src { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .news-block .nt { font-size: 15px; color: var(--text); margin-bottom: 4px; }
  .news-block .nl { color: var(--text-2); font-size: 12px; word-break: break-all; }

  /* 复盘 */
  .replay-block { background: var(--bg-3); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .replay-block .day { font-size: 16px; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
  .replay-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .replay-cell { padding: 10px 12px; background: var(--bg-1); border-radius: 8px; border-left: 3px solid var(--accent); }
  .replay-cell:nth-child(1) { border-left-color: var(--success); }
  .replay-cell:nth-child(2) { border-left-color: var(--warning); }
  .replay-cell:nth-child(3) { border-left-color: var(--accent); }
  .replay-cell:nth-child(4) { border-left-color: var(--danger); }
  .replay-cell .lab { font-size: 11px; color: var(--text-3); margin-bottom: 2px; }
  .replay-cell .val { font-size: 14px; color: var(--text); white-space: pre-wrap; word-break: break-word; }
  .replay-block .emo { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
  .replay-block .emo .scale { display: inline-block; padding: 2px 10px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 600; }

  /* 影视库 */
  .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
  .media-card {
    background: var(--bg-3); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; display: flex; flex-direction: column; gap: 8px;
  }
  .media-card .poster {
    aspect-ratio: 2/3; background: var(--bg-1); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; font-size: 38px; margin-bottom: 8px;
  }
  .media-card .m-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .media-card .m-sub { font-size: 11px; color: var(--text-2); }
  .media-card .m-rating { color: var(--warning); font-size: 13px; letter-spacing: 1px; }
  .media-card .actions { display: flex; gap: 6px; margin-top: auto; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; background: var(--accent-soft); color: var(--accent); }
  .tag.gray { background: rgba(107,114,128,0.12); color: var(--text-2); }
  .tag.green { background: rgba(16,185,129,0.12); color: var(--success); }

  /* 设置 */
  .set-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .set-card .section-title { margin-bottom: 12px; }
  .set-grid { display: grid; grid-template-columns: 120px 1fr; gap: 10px; align-items: center; margin-top: 4px; }
  .set-grid > div:not(.set-label):not(input):not(select) { }
  .set-actions { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .hint { font-size: 12px; color: var(--text-3); margin-top: 12px; line-height: 1.7; }
  .hint code { color: var(--accent); }
  .sync-status { display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .sync-status.on { background: rgba(16,185,129,0.12); color: var(--success); }
  .sync-status.off { background: rgba(107,114,128,0.12); color: var(--text-2); }

  /* 弹窗 */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(17,24,39,0.4); z-index: 100;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: var(--bg-2); border: 1px solid var(--border-strong); border-radius: 16px;
    padding: 22px; width: 100%; max-width: 480px; box-shadow: 0 20px 60px rgba(0,0,0,0.18);
  }
  .modal h3 { margin-bottom: 14px; font-size: 17px; font-weight: 600; }
  .modal .form-row { margin-bottom: 12px; }
  .modal label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 4px; }
  .modal input, .modal textarea, .modal select {
    width: 100%; background: var(--bg-1); border: 1px solid var(--border);
    padding: 9px 12px; border-radius: 8px; color: var(--text); outline: none; font-size: 14px;
  }
  .modal input:focus, .modal textarea:focus, .modal select:focus { border-color: var(--accent); }
  .modal .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }

  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(40px);
    background: #1F2937; color: #fff; padding: 10px 18px; border-radius: 10px;
    font-size: 14px; opacity: 0; transition: transform 0.3s, opacity 0.3s; z-index: 200;
    box-shadow: 0 12px 30px rgba(0,0,0,0.2); max-width: 80vw;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* ============== 移动端底部导航 ============== */
  .mobile-nav { display: none; }

  @media (max-width: 1100px) {
    .feature-grid { grid-template-columns: repeat(3, 1fr); }
    .habit-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .main { padding: 22px 16px 92px; }
    .greeting { margin: 14px 0 36px; }
    .greeting .slogan { font-size: 34px; }
    .feature-grid { grid-template-columns: repeat(2, 1fr); }
    .page-sub { margin-left: 0; }
    .page-head .big-icon { width: 48px; height: 48px; font-size: 22px; }
    .replay-grid { grid-template-columns: 1fr; }
    .mobile-nav {
      display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 60;
      background: #FFFFFF; border-top: 1px solid var(--border);
      overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 6px 4px;
      padding-bottom: calc(6px + env(safe-area-inset-bottom));
    }
    .mobile-nav button {
      flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 6px 14px; color: var(--text-2); font-size: 10px; min-width: 56px;
    }
    .mobile-nav button .mi { font-size: 19px; line-height: 1; }
    .mobile-nav button.active { color: var(--accent); }
    .mobile-nav::-webkit-scrollbar { display: none; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="dot">·</span><span>J · 工作台</span></div>
    <nav class="nav" id="nav">
      <div class="nav-item active" data-page="home"><span class="ico">🏠</span><span>主页</span></div>
      <div class="nav-item" data-page="tasks"><span class="ico">📅</span><span>今日任务</span></div>
      <div class="nav-item" data-page="capture"><span class="ico">✏️</span><span>快速捕记</span></div>
      <div class="nav-item" data-page="countdown"><span class="ico">⏳</span><span>倒数日</span></div>
      <div class="nav-item" data-page="habit"><span class="ico">✅</span><span>习惯打卡</span></div>
      <div class="nav-item" data-page="news"><span class="ico">📰</span><span>信息日报</span></div>
      <div class="nav-item" data-page="replay"><span class="ico">📝</span><span>每日复盘</span></div>
      <div class="nav-item" data-page="media"><span class="ico">🎬</span><span>影视库</span></div>
      <div class="nav-item" data-page="settings"><span class="ico">⚙️</span><span>设置</span></div>
    </nav>
    <div class="footer">
      数据默认保存在本浏览器本地。<br>开启云端同步后可在手机 / 电脑间共享。
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<!-- 移动端底部导航 -->
<nav class="mobile-nav" id="mobileNav">
  <button data-page="home"><span class="mi">🏠</span>主页</button>
  <button data-page="tasks"><span class="mi">📅</span>任务</button>
  <button data-page="capture"><span class="mi">✏️</span>捕记</button>
  <button data-page="countdown"><span class="mi">⏳</span>倒数</button>
  <button data-page="habit"><span class="mi">✅</span>习惯</button>
  <button data-page="news"><span class="mi">📰</span>日报</button>
  <button data-page="replay"><span class="mi">📝</span>复盘</button>
  <button data-page="media"><span class="mi">🎬</span>影视</button>
  <button data-page="settings"><span class="mi">⚙️</span>设置</button>
</nav>

<div class="modal-mask" id="modal"><div class="modal" id="modal-inner"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ===================== 数据层 ===================== */
const DB_KEY = 'j_workbench_v1';

const DEFAULT_DATA = {
  profile: { name: '计俊杰', slogan: '需要进步' },
  countdowns: [ { id: cid(), title: '26下学期六级考试', date: '2026-12-13' } ],
  tasks: [],
  captures: [],
  habits: [

function cid() { return 'c' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

function loadDB() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (!raw) return JSON.parse(JSON.stringify(DEFAULT_DATA));
    const data = JSON.parse(raw);
    return { ...DEFAULT_DATA, ...data, profile: { ...DEFAULT_DATA.profile, ...(data.profile || {}) } };
  } catch (e) { return JSON.parse(JSON.stringify(DEFAULT_DATA)); }
}
function saveDB() {
  try { localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
  catch (e) { toast('保存失败：' + e.message); }

/* ===================== 云同步（GitHub Gist） ===================== */
const SYNC = {
  token: localStorage.getItem('jwb_gist_token') || '',
  gistId: localStorage.getItem('jwb_gist_id') || '',
  auto: localStorage.getItem('jwb_autosync') !== '0'
};
function saveSyncCreds() {
  localStorage.setItem('jwb_gist_token', SYNC.token);
  localStorage.setItem('jwb_gist_id', SYNC.gistId);
  localStorage.setItem('jwb_autosync', SYNC.auto ? '1' : '0');
}
let _syncTimer = null;
function scheduleSync() {
  if (!SYNC.auto || !SYNC.token) return;
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(() => gistSave(false), 1500);
}
async function gistSave(showToast = true) {
  if (!SYNC.token) { if (showToast) toast('请先在设置中连接云端'); return false; }
  const url = SYNC.gistId ? `https://api.github.com/gists/${SYNC.gistId}` : 'https://api.github.com/gists';
  const method = SYNC.gistId ? 'PATCH' : 'POST';
  const body = { files: { 'workbench.json': { content: JSON.stringify(DB, null, 2) } } };
  if (!SYNC.gistId) { body.description = 'J Workbench Data'; body.public = false; }
  try {
    const res = await fetch(url, {
      method,
      headers: { 'Authorization': `Bearer ${SYNC.token}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github+json' },
      body: JSON.stringify(body)
    });
    if (!res.ok) { const j = await res.json().catch(()=>({})); throw new Error((j.message) || ('HTTP ' + res.status)); }
    const data = await res.json();
    if (!SYNC.gistId) SYNC.gistId = data.id;
    saveSyncCreds();
    if (showToast) toast('已同步到云端');
    return true;
  } catch (e) { if (showToast) toast('同步失败：' + e.message); return false; }
}
async function gistLoad(showToast = true) {
  if (!SYNC.token) { if (showToast) toast('请先在设置中连接云端'); return false; }
  if (!SYNC.gistId) { if (showToast) toast('尚未创建云端存储，请先上传'); return false; }
  try {
    const res = await fetch(`https://api.github.com/gists/${SYNC.gistId}`, {
      headers: { 'Authorization': `Bearer ${SYNC.token}`, 'Accept': 'application/vnd.github+json' }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const content = data.files['workbench.json'] ? data.files['workbench.json'].content : null;
    if (!content) throw new Error('云端暂无可读数据');
    const parsed = JSON.parse(content);
    DB = { ...DEFAULT_DATA, ...parsed, profile: { ...DEFAULT_DATA.profile, ...(parsed.profile || {}) } };
    saveDB();
    if (showToast) toast('已从云端加载');
    render();
    return true;
  } catch (e) { if (showToast) toast('加载失败：' + e.message); return false; }
}

/* ===================== 工具 ===================== */
function $(s) { return document.querySelector(s); }
function $$(s) { return [...document.querySelectorAll(s)]; }
function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'style') Object.assign(e.style, attrs[k]);
    else if (k.startsWith('on') && typeof attrs[k] === 'function') e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k === 'data') for (const dk in attrs.data) e.dataset[dk] = attrs.data[dk];
    else if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]);
  }
  children.flat().forEach(c => {
    if (c === undefined || c === null) return;
    if (typeof c === 'string' || typeof c === 'number') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}
function fmtDate(dStr) {
  if (!dStr) return '';
  const d = new Date(dStr + 'T00:00:00');
  const wk = ['日','一','二','三','四','五','六'][d.getDay()];
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} · 周${wk}`;
}
function daysBetween(target) {
  const today = new Date(); today.setHours(0,0,0,0);
  const t = new Date(target + 'T00:00:00');
  return Math.round((t - today) / (1000*60*60*24));
}
function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDateTime(ts) {
  const d = new Date(ts);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function toast(msg, dur = 2200) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), dur);
}

        el('div', { class: 'item-main' },

          el('div', { class: 'nt' }, n.title),
          n.link ? el('a', { class: 'nl', href: n.link, target: '_blank', rel: 'noopener' }, n.link) : null
        ),
        el('div', { class: 'item-actions' }, el('button', { class: 'icon-btn del', onclick: () => deleteItem('news', n.id) }, '🗑'))
      )));
      dayDiv.appendChild(list); wrap.appendChild(dayDiv);
    });
  }
  return wrap;
}
function addNews() {
  const source = $('#n-src').value.trim(); const title = $('#n-title').value.trim(); const link = $('#n-link').value.trim();
  if (!title) { toast('请填写标题'); return; }
  DB.news.push({ id: cid(), source, title, link, date: todayKey() }); saveDB();
  $('#n-src').value=''; $('#n-title').value=''; $('#n-link').value=''; render();
}

/* ===================== 每日复盘 ===================== */
function renderReplay() {
  const wrap = el('div');
  wrap.appendChild(pageHeader('📝', '每日复盘', 'KISS 复盘 + 情绪'));
  wrap.appendChild(el('div', { class: 'toolbar' }, el('button', { class: 'btn', onclick: () => addReplayDialog(todayKey()) }, '+ 复盘今天')));
  if (DB.replay.length === 0) {
    wrap.appendChild(el('div', { class: 'empty' }, el('div', { class: 'big' }, '📝'), el('div', {}, '还没有复盘。K=保持，I=改进，S=开始，S=停止。')));
  } else {
    [...DB.replay].sort((a,b)=>b.date.localeCompare(a.date)).forEach(r => {
      wrap.appendChild(el('div', { class: 'replay-block' },
        el('div', { class: 'day' }, `📅 ${r.date}`),
        el('div', { class: 'replay-grid' },
          cell('K · Keep 保持', r.keep), cell('I · Improve 改进', r.improve),
          cell('S · Start 开始', r.start), cell('S · Stop 停止', r.stop)
        ),
        el('div', { class: 'emo' }, el('span', {}, '今日情绪'), el('span', { class: 'scale' }, moodText(r.mood))),
        el('div', { style: { display: 'flex', gap: '8px', marginTop: '12px' } },
          el('button', { class: 'btn-ghost', style: { padding: '6px 12px', fontSize: '12px', border: '1px solid var(--border-strong)', borderRadius: '6px' }, onclick: () => addReplayDialog(r.date, r) }, '编辑'),
          el('button', { class: 'btn-ghost', style: { padding: '6px 12px', fontSize: '12px', border: '1px solid var(--border-strong)', borderRadius: '6px', color: 'var(--danger)' }, onclick: () => deleteItem('replay', r.id) }, '删除')
        )
      ));
    });
  }
  return wrap;
}
function cell(label, value) {
  return el('div', { class: 'replay-cell' }, el('div', { class: 'lab' }, label), el('div', { class: 'val' }, value || '—'));
}
function moodText(m) {
  if (m === undefined || m === null || m === '') return '未记录';
  const map = ['😞 很差','😟 不太好','😐 一般','🙂 还行','😊 不错','🤩 超棒'];
  return map[m] || `${m}/5`;
}
function addReplayDialog(date, existing = null) {
  const isEdit = !!existing;
  openModal((isEdit ? '编辑' : '添加') + '复盘 · ' + date, (content, actions) => {
    const fld = (id, label, ph, val) => { const t = el('textarea', { id, placeholder: ph, rows: '3', style: { resize: 'vertical' } }); if (val) t.value = val; content.appendChild(formRow(label, t)); return t; };
    fld('r-keep', 'K · Keep 保持', '今天做得好的事，保持下去', existing?.keep);
    fld('r-improve', 'I · Improve 改进', '哪里可以做得更好', existing?.improve);
    fld('r-start', 'S · Start 开始', '明天开始做什么新尝试', existing?.start);
    fld('r-stop', 'S · Stop 停止', '明天停止做什么', existing?.stop);
    const mood = el('select', { id: 'r-mood' },
      el('option', { value: '' }, '选择情绪...'),
      el('option', { value: '0' }, '😞 很差'), el('option', { value: '1' }, '😟 不太好'),
      el('option', { value: '2' }, '😐 一般'), el('option', { value: '3' }, '🙂 还行'),
      el('option', { value: '4' }, '😊 不错'), el('option', { value: '5' }, '🤩 超棒')
    );
    if (existing?.mood !== undefined && existing?.mood !== null && existing?.mood !== '') mood.value = existing.mood;
    content.appendChild(formRow('今日情绪', mood));
    actions.appendChild(button('保存', { onclick: () => {
      const obj = { date, keep: $('#r-keep').value.trim(), improve: $('#r-improve').value.trim(), start: $('#r-start').value.trim(), stop: $('#r-stop').value.trim(), mood: $('#r-mood').value === '' ? null : Number($('#r-mood').value) };
      if (isEdit) Object.assign(existing, obj); else DB.replay.push({ id: cid(), ...obj });
      saveDB(); closeModal(); toast('已保存'); render();
    }}));
  });
}

/* ===================== 影视库 ===================== */
function renderMedia(filter = 'all') {
  const wrap = el('div');
  wrap.appendChild(pageHeader('🎬', '影视库', '想看 / 已看'));
  wrap.appendChild(el('div', { class: 'toolbar' },
    el('button', { class: 'btn', onclick: addMediaDialog }, '+ 添加'),
    el('select', { id: 'media-filter', onchange: (e) => renderMedia(e.target.value) },
      el('option', { value: 'all' }, '全部'), el('option', { value: 'want' }, '想看'), el('option', { value: 'done' }, '已看'))
  ));
  const items = filter === 'all' ? DB.media : DB.media.filter(m => m.status === filter);
  if (items.length === 0) {
    wrap.appendChild(el('div', { class: 'empty' }, el('div', { class: 'big' }, '🎬'), el('div', {}, '影视库还没有内容。')));
    return wrap;
  }
  const grid = el('div', { class: 'media-grid' });
  items.forEach(m => {
    grid.appendChild(el('div', { class: 'media-card' },
      el('div', { class: 'poster' }, m.emoji || (m.type === 'series' ? '📺' : '🎬')),
      el('div', { class: 'm-title' }, m.title),
      el('div', { class: 'm-sub' }, (m.type === 'series' ? '剧集' : '电影') + (m.year ? ` · ${m.year}` : '')),
      el('div', { class: 'm-rating' }, m.rating ? '★'.repeat(Math.min(5, m.rating)) + '☆'.repeat(5 - Math.min(5, m.rating)) : '未评分'),
      el('div', { style: { display: 'flex', gap: '6px', flexWrap: 'wrap' } },
        el('span', { class: 'tag ' + (m.status === 'done' ? 'green' : 'gray') }, m.status === 'done' ? '已看' : '想看'),
        m.note ? el('span', { class: 'tag gray', style: { maxWidth: '120px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }, title: m.note }, m.note) : null
      ),
      el('div', { class: 'actions' },
        el('button', { class: 'btn-ghost', style: { padding: '6px 10px', fontSize: '12px', borderRadius: '6px', border: '1px solid var(--border-strong)' }, onclick: () => toggleMediaStatus(m.id) }, m.status === 'done' ? '移回想看' : '标记已看'),
        el('button', { class: 'btn-ghost', style: { padding: '6px 10px', fontSize: '12px', borderRadius: '6px', border: '1px solid var(--border-strong)', color: 'var(--danger)' }, onclick: () => deleteItem('media', m.id) }, '删除')
      )
    ));
  });
  wrap.appendChild(grid);
  return wrap;
}
function toggleMediaStatus(id) {
  const m = DB.media.find(x=>x.id===id); m.status = m.status === 'done' ? 'want' : 'done';
  if (m.status === 'done' && !m.rating) m.rating = 4; saveDB(); render();
}
function addMediaDialog() {
  openModal('添加影视', (content, actions) => {
    content.appendChild(formRow('标题', input({ id: 'm-title', placeholder: '片名' })));
    content.appendChild(formRow('类型', el('select', { id: 'm-type' }, el('option', { value: 'movie' }, '电影'), el('option', { value: 'series' }, '剧集'))));
    content.appendChild(formRow('年份', input({ id: 'm-year', type: 'number', placeholder: '2024', min: '1900', max: '2100' })));
    content.appendChild(formRow('状态', el('select', { id: 'm-status' }, el('option', { value: 'want' }, '想看'), el('option', { value: 'done' }, '已看'))));
    content.appendChild(formRow('评分（0-5）', input({ id: 'm-rating', type: 'number', min: '0', max: '5', placeholder: '可选' })));
    content.appendChild(formRow('Emoji', input({ id: 'm-emoji', placeholder: '🎬' })));
    content.appendChild(formRow('短评 / 备注', (() => { const t = el('textarea', { id: 'm-note', rows: '2', placeholder: '一句话...' }); return t; })()));
    actions.appendChild(button('添加', { onclick: () => {
      const title = $('#m-title').value.trim(); if (!title) { toast('请填写标题'); return; }
      DB.media.push({ id: cid(), title, type: $('#m-type').value, year: $('#m-year').value ? Number($('#m-year').value) : null, status: $('#m-status').value, rating: $('#m-rating').value ? Number($('#m-rating').value) : 0, emoji: $('#m-emoji').value.trim(), note: $('#m-note').value.trim() });
      saveDB(); closeModal(); toast('已添加'); render();
    }}));
  });
}

/* ===================== 设置 ===================== */
function renderSettings() {
  const wrap = el('div');
  wrap.appendChild(pageHeader('⚙️', '设置', '个人信息 + 云同步 + 数据管理'));

  // 个人信息
  const c1 = el('div', { class: 'set-card' },
    el('div', { class: 'section-title' }, el('span', { class: 'ico' }, '👤'), el('span', {}, '个人信息')),
    el('div', { class: 'set-grid' },
      el('div', { class: 'set-label' }, '姓名：'),
      input({ id: 'set-name', value: DB.profile.name, oninput: (e) => { DB.profile.name = e.target.value; saveDB(); } }),
      el('div', { class: 'set-label' }, '标语：'),
      input({ id: 'set-slogan', value: DB.profile.slogan, oninput: (e) => { DB.profile.slogan = e.target.value; saveDB(); } })
    )
  );
  wrap.appendChild(c1);

  // 云同步
  const syncOn = SYNC.token && SYNC.gistId;
  const c2 = el('div', { class: 'set-card' },
    el('div', { class: 'section-title' },
      el('span', { class: 'ico' }, '☁️'), el('span', {}, '云端同步（跨设备共享）'),
      el('span', { class: 'sync-status ' + (syncOn ? 'on' : 'off'), style: { marginLeft: 'auto' } }, syncOn ? '已连接' : '未连接')
    ),
    el('div', { class: 'set-grid' },
      el('div', { class: 'set-label' }, 'GitHub Token：'),
      el('input', { type: 'password', id: 'set-token', placeholder: '粘贴你的 GitHub Personal Access Token（需 gist 权限）', value: SYNC.token, style: { gridColumn: '2 / 3' } })
    ),
    el('div', { class: 'set-actions' },
      el('button', { class: 'btn', onclick: saveToken }, '保存凭证'),
      el('button', { class: 'btn-ghost', style: { padding: '9px 14px', borderRadius: '8px', border: '1px solid var(--border-strong)' }, onclick: () => gistSave(true) }, '上传到云端'),
      el('button', { class: 'btn-ghost', style: { padding: '9px 14px', borderRadius: '8px', border: '1px solid var(--border-strong)' }, onclick: () => gistLoad(true) }, '从云端下载'),
      el('button', { class: 'btn-ghost', style: { padding: '9px 14px', borderRadius: '8px', border: '1px solid var(--border-strong)' }, onclick: toggleAutoSync }, SYNC.auto ? '自动同步：开' : '自动同步：关')
    ),
    el('div', { class: 'hint' },
      '原理：数据集中存到你的 ', el('code', {}, 'GitHub Gist'), '，手机 / 电脑打开同一网页并填入同一个 Token 即可共享、自动同步。<br>',
      '获取 Token：登录 GitHub → Settings → Developer settings → ', el('code', {}, 'Personal access tokens'), ' → Tokens (classic) → Generate new token (classic) → 勾选 ', el('code', {}, 'gist'), ' 权限 → 生成并复制。<br>',
      '首次「上传到云端」会自动创建私有 Gist；开启「自动同步」后每次改动都会在 1.5 秒后静默上传。Token 仅保存在你本机浏览器，请妥善保管。')
  );
  wrap.appendChild(c2);

  // 数据管理
  const c3 = el('div', { class: 'set-card' },
    el('div', { class: 'section-title' }, el('span', { class: 'ico' }, '💾'), el('span', {}, '数据管理')),
    el('div', { class: 'set-actions' },
      el('button', { class: 'btn', onclick: exportData }, '导出 JSON'),
      el('button', { class: 'btn-ghost', style: { padding: '9px 14px', borderRadius: '8px', border: '1px solid var(--border-strong)' }, onclick: importData }, '导入 JSON'),
      el('button', { class: 'btn-danger', style: { padding: '9px 14px', borderRadius: '8px', border: 'none' }, onclick: clearAllData }, '清空所有数据')
    ),
    el('div', { class: 'hint' },
      '数据存于浏览器 ', el('code', {}, 'localStorage'), '（', el('code', {}, 'j_workbench_v1'), '）。<br>',
      '• 导出 / 导入 JSON：在设备间手动备份与恢复。<br>',
      '• 清空数据：删除所有记录（不可恢复，请先导出）。')
  );
  wrap.appendChild(c3);

  // 统计
  const stats = {
    '倒数日': DB.countdowns.length, '今日任务': DB.tasks.length, '快速捕记': DB.captures.length,
    '已打卡次数': DB.habits.reduce((s,h)=>s+Object.keys(h.log).length,0), '信息条数': DB.news.length,
    '复盘天数': DB.replay.length, '影视条目': DB.media.length
  };
  wrap.appendChild(el('div', { class: 'set-card' },
    el('div', { class: 'section-title' }, el('span', { class: 'ico' }, '📈'), el('span', {}, '数据概览')),
    el('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(180px, 1fr))', gap: '10px', marginTop: '8px' } },
      ...Object.entries(stats).map(([k,v]) => el('div', { style: { background: 'var(--bg-3)', padding: '14px', borderRadius: '10px', border: '1px solid var(--border)' } },
        el('div', { style: { fontSize: '22px', fontWeight: '700', color: 'var(--accent)' } }, v),
        el('div', { style: { fontSize: '12px', color: 'var(--text-2)' } }, k)))
    )
  ));
  return wrap;
}
function saveToken() {
  SYNC.token = $('#set-token').value.trim();
  saveSyncCreds();
  toast('凭证已保存' + (SYNC.gistId ? '，可直接同步' : '，请点「上传到云端」创建存储'));
  render();
}
function toggleAutoSync() { SYNC.auto = !SYNC.auto; saveSyncCreds(); toast('自动同步已' + (SYNC.auto ? '开启' : '关闭')); render(); }
function exportData() {
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: `j-workbench-${todayKey()}.json` });
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 0);
  toast('已下载 JSON');
}
function importData() {
  const inp = el('input', { type: 'file', accept: '.json' });
  inp.onchange = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => { try {
      const data = JSON.parse(r.result);
      if (!data.profile) throw new Error('文件格式不正确');
      if (!confirm('导入会覆盖当前所有数据，确定继续？')) return;
      DB = { ...DEFAULT_DATA, ...data, profile: { ...DEFAULT_DATA.profile, ...(data.profile||{}) } };
      saveDB(); toast('导入成功'); render();
    } catch (err) { toast('导入失败：' + err.message); } };
    r.readAsText(file);
  };
  inp.click();
}
function clearAllData() {
  if (!confirm('⚠️ 确定清空所有数据？此操作不可恢复，建议先导出备份。')) return;
  if (!confirm('再次确认：真的要清空吗？')) return;
  DB = JSON.parse(JSON.stringify(DEFAULT_DATA)); saveDB(); toast('已清空'); render();
}

/* ===================== 通用 ===================== */
function pageHeader(icon, title, sub) {
  return el('div', {},
    el('div', { class: 'page-head' }, el('div', { class: 'big-icon' }, icon), el('h1', {}, title)),
    el('div', { class: 'page-sub' }, sub || '')
  );
}
function formRow(label, inputEl) { const w = el('div', { class: 'form-row' }); w.appendChild(el('label', {}, label)); w.appendChild(inputEl); return w; }
function button(text, opts = {}) {
  return el('button', { class: 'btn ' + (opts.class || 'btn-ghost'), style: { padding: '9px 16px', borderRadius: '8px', border: opts.class === 'btn-danger' ? 'none' : '1px solid var(--border-strong)', ...(opts.style||{}) }, onclick: opts.onclick }, text);
}
function input(attrs) { return el('input', { ...attrs, style: { ...(attrs.style||{}) } }); }
function openModal(title, build) {
  const mask = $('#modal'); const inner = $('#modal-inner'); inner.innerHTML = '';
  inner.appendChild(el('h3', {}, title));
  const content = el('div', {}); const actions = el('div', { class: 'modal-actions' });
  actions.appendChild(el('button', { class: 'btn-ghost', style: { padding: '9px 14px', borderRadius: '8px', border: '1px solid var(--border-strong)' }, onclick: closeModal }, '取消'));
  inner.appendChild(content); inner.appendChild(actions); mask.classList.add('show'); build(content, actions);
}
function closeModal() { $('#modal').classList.remove('show'); }
function deleteItem(key, id) {
  if (!confirm('确认删除？')) return;
  DB[key] = DB[key].filter(x => x.id !== id); saveDB(); toast('已删除'); render();
}

/* ===================== render ===================== */
function render() {
  const main = $('#main'); main.innerHTML = '';
  let node;
  switch (DB.page) {
    case 'home': node = renderHome(); break;
    case 'tasks': node = renderTasks(); break;
    case 'capture': node = renderCapture(); break;
    case 'countdown': node = renderCountdown(); break;
    case 'habit': node = renderHabit(); break;
    case 'news': node = renderNews(); break;
    case 'replay': node = renderReplay(); break;
    case 'media': node = renderMedia('all'); break;
    case 'settings': node = renderSettings(); break;
    default: node = renderHome();
  }
  main.appendChild(node);
  if (!['home','tasks','capture','countdown','habit','news','replay','media','settings'].includes(DB.page)) DB.page = 'home';
  updateNavActive();
  main.scrollTop = 0;
}

/* ===================== 启动 ===================== */
$('#nav').addEventListener('click', (e) => { const item = e.target.closest('.nav-item'); if (item) goto(item.dataset.page); });
$('#mobileNav').addEventListener('click', (e) => { const btn = e.target.closest('button'); if (btn) goto(btn.dataset.page); });
$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

render();
// 启动时若已开启自动同步且已连接云端，则拉取最新数据
if (SYNC.auto && SYNC.token && SYNC.gistId) gistLoad(false);
</script>
</body>
</html>
