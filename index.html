<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>J · 个人工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233B82F6'/%3E%3Ctext x='50%25' y='55%25' text-anchor='middle' fill='%23fff' font-family='Arial' font-size='18' font-weight='bold'%3EJ%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2563EB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="J 工作台">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<style>
  /* ============== 极简浅色主题 ============== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
                 "Hiragino Sans GB", "Source Han Sans CN", sans-serif;
    background: #F5F6F8;
    color: #1F2937;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea, select { font-family: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }

  :root {
    --bg-0: #F5F6F8;
    --bg-1: #FFFFFF;
    --bg-2: #FFFFFF;
    --bg-3: #FFFFFF;
    --bg-hover: #F1F3F6;
    --border: rgba(17,24,39,0.08);
    --border-strong: rgba(17,24,39,0.14);
    --text: #1F2937;
    --text-2: #6B7280;
    --text-3: #9CA3AF;
    --accent: #3B82F6;
    --accent-2: #8B5CF6;
    --accent-soft: rgba(59,130,246,0.10);
    --danger: #EF4444;
    --success: #10B981;
    --warning: #F59E0B;
    --purple: #7C3AED;
    --pink: #EC4899;
    --radius: 14px;
    --radius-sm: 10px;
    --shadow: 0 1px 2px rgba(17,24,39,0.04), 0 4px 16px rgba(17,24,39,0.04);
  }

  .app { display: grid; grid-template-columns: 230px 1fr; height: 100vh; width: 100vw; }

  /* ============== 侧边栏（桌面） ============== */
  .sidebar {
    background: #FFFFFF;
    border-right: 1px solid var(--border);
    padding: 26px 14px;
    display: flex; flex-direction: column;
    overflow-y: auto;
  }
  .brand {
    display: flex; align-items: baseline; gap: 6px;
    padding: 4px 12px 22px; font-weight: 700; font-size: 18px; letter-spacing: 0.3px;
  }
  .brand .dot { color: var(--accent); font-size: 22px; line-height: 1; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 11px;
    padding: 11px 13px; border-radius: 10px;
    color: var(--text-2); font-size: 14px; user-select: none;
    transition: background 0.15s, color 0.15s;
  }
  .nav-item:hover { background: var(--bg-hover); color: var(--text); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav-item .ico { width: 18px; text-align: center; font-size: 15px; }
  .sidebar .footer {
    margin-top: auto; padding: 12px; color: var(--text-3); font-size: 11px; line-height: 1.6;
  }

  /* ============== 主区 ============== */
  .main { overflow-y: auto; padding: 40px 52px 90px; }
  .main::-webkit-scrollbar { width: 8px; }
  .main::-webkit-scrollbar-thumb { background: rgba(17,24,39,0.12); border-radius: 4px; }

  /* ----- 主页问候 ----- */
  .greeting {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    margin: 30px 0 42px;
    padding-left: 4px;
  }
  .greeting .name {
    font-size: 32px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    display: inline-block;
    padding: 2px 10px 4px;
    border-radius: 8px;
    letter-spacing: 1px;
    transition: background 0.15s;
    line-height: 1.1;
  }
  .greeting .name:hover { background: var(--bg-hover); }
  .greeting .slogan {
    margin-top: 6px;
    font-size: 44px;
    font-weight: 800;
    line-height: 1.1;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 4px;
    cursor: pointer;
    display: inline-block;
    padding: 2px 12px 6px;
    border-radius: 10px;
    transition: filter 0.15s;
  }
  .greeting .slogan:hover { filter: brightness(1.05); }

  .section { margin-bottom: 30px; }
  .section-title {
    font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px;
    margin-bottom: 14px; color: var(--text);
  }
  .section-title .ico { color: var(--accent); }
  .section-title .actions { margin-left: auto; display: flex; gap: 8px; }
  .card {
    background: var(--bg-2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow);
  }

  /* ----- 倒数日 ----- */
  .countdown-list { display: flex; flex-direction: column; gap: 12px; }
  .countdown-row {
    display: flex; align-items: center; gap: 26px;
    padding: 18px 22px; background: var(--bg-3);
    border-radius: var(--radius-sm); border: 1px solid var(--border);
  }
  .countdown-num {
    font-size: 44px; font-weight: 800; color: var(--accent);
    min-width: 92px; text-align: right; line-height: 1;
  }
  .countdown-info { flex: 1; min-width: 0; }
  .countdown-info .title { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .countdown-info .date { font-size: 13px; color: var(--text-2); }
  .countdown-info .date.passed { color: var(--danger); }
  .countdown-info .days-label { display: inline-block; margin-left: 4px; color: var(--text-3); font-size: 12px; }
  .countdown-row .del {
    color: var(--danger); opacity: 0.55; font-size: 16px; padding: 6px 10px;
    border-radius: 6px; transition: opacity 0.15s, background 0.15s;
  }
  .countdown-row .del:hover { opacity: 1; background: rgba(239,68,68,0.08); }
  .countdown-add {
    display: flex; gap: 10px; margin-top: 14px; padding: 14px;
    background: var(--bg-3); border-radius: var(--radius-sm);
    border: 1px dashed var(--border-strong);
  }
  .countdown-add input {
    flex: 1; background: var(--bg-1); border: 1px solid var(--border);
    padding: 10px 12px; border-radius: 8px; color: var(--text); outline: none; font-size: 14px;
  }
  .countdown-add input:focus { border-color: var(--accent); }
  .countdown-add input[type="text"] { flex: 2; }

  /* ----- 功能概览 ----- */
  .feature-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .feature-card {
    background: var(--bg-3); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 22px 18px; cursor: pointer; min-height: 120px;
    display: flex; flex-direction: column; transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
  }
  .feature-card:hover { transform: translateY(-3px); border-color: var(--border-strong); box-shadow: var(--shadow); }
  .feature-card .icon { font-size: 28px; margin-bottom: 14px; line-height: 1; }
  .feature-card .name { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .feature-card .desc { font-size: 12px; color: var(--text-2); }
  .feature-card.miss .icon { color: var(--accent); }
  .feature-card.capture .icon { color: var(--warning); }
  .feature-card.countdown .icon { color: var(--accent); }
  .feature-card.habit .icon { color: var(--success); }
  .feature-card.news .icon { color: var(--purple); }
  .feature-card.replay .icon { color: var(--pink); }
  .feature-card.media .icon { color: var(--danger); }

  /* ============== 详情页 ============== */
  .page-head { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
  .page-head .big-icon {
    width: 56px; height: 56px; border-radius: 14px; background: var(--bg-3);
    display: flex; align-items: center; justify-content: center; font-size: 26px; border: 1px solid var(--border);
  }
  .page-head h1 { font-size: 26px; font-weight: 700; }
  .page-sub { color: var(--text-2); font-size: 14px; margin-bottom: 26px; margin-left: 70px; }
  .toolbar {
    display: flex; gap: 10px; margin-bottom: 18px; align-items: center;
    background: var(--bg-3); padding: 12px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .toolbar input, .toolbar select, .toolbar textarea {
    background: var(--bg-1); border: 1px solid var(--border); padding: 9px 12px;
    border-radius: 8px; color: var(--text); outline: none; font-size: 14px;
  }
  .toolbar input:focus, .toolbar select:focus, .toolbar textarea:focus { border-color: var(--accent); }
  .btn {
    padding: 9px 16px; border-radius: 8px; background: var(--accent); color: #fff;
    font-weight: 600; font-size: 14px; transition: filter 0.15s, transform 0.15s; white-space: nowrap;
  }
  .btn:hover { filter: brightness(1.05); }
  .btn:active { transform: scale(0.97); }
  .btn-ghost { background: transparent; color: var(--text-2); border: 1px solid var(--border-strong); }
  .btn-ghost:hover { background: var(--bg-hover); color: var(--text); }
  .btn-danger { background: rgba(239,68,68,0.10); color: var(--danger); }
  .btn-danger:hover { background: rgba(239,68,68,0.16); }

  .item-list { display: flex; flex-direction: column; gap: 8px; }
  .item {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    background: var(--bg-3); border: 1px solid var(--border); border-radius: 10px; transition: border-color 0.15s;
  }
  .item:hover { border-color: var(--border-strong); }
  .item.done { opacity: 0.5; }
  .item.done .item-text { text-decoration: line-through; }
  .item .checkbox {
    width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--border-strong);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: all 0.15s; cursor: pointer; color: transparent; font-size: 12px; font-weight: 700;
  }
  .item.done .checkbox { background: var(--success); border-color: var(--success); color: #fff; }
  .item .item-main { flex: 1; min-width: 0; }
  .item .item-text { font-size: 14px; color: var(--text); word-break: break-word; }
  .item .item-meta { font-size: 12px; color: var(--text-3); margin-top: 2px; }
  .item .item-actions { display: flex; gap: 4px; }
  .item .icon-btn {
    color: var(--text-3); padding: 4px 8px; border-radius: 6px; font-size: 14px;
    transition: color 0.15s, background 0.15s;
  }
  .item .icon-btn:hover { color: var(--text); background: var(--bg-hover); }
  .item .icon-btn.del:hover { color: var(--danger); background: rgba(239,68,68,0.08); }

  .empty { text-align: center; color: var(--text-3); padding: 40px 20px; font-size: 14px; }
  .empty .big { font-size: 36px; margin-bottom: 8px; opacity: 0.4; }

/* 今日任务时间轴 */
.task-row { display: grid; grid-template-columns: 80px 1fr auto; gap: 12px; align-items: center; }
.task-row .time { color: var(--accent); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; text-align: right; }
.task-row .text-input {
  background: var(--bg-1); border: 1px solid var(--border); padding: 9px 12px;
  border-radius: 8px; color: var(--text); outline: none; font-size: 14px; width: 100%;
}
.task-row .text-input:focus { border-color: var(--accent); }

/* 每日任务：月历 + 当日 */
.task-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
.task-crumb { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; color: var(--text); }
.task-crumb .tag { font-size: 12px; padding: 2px 8px; }
.task-pane { display: grid; grid-template-columns: minmax(260px, 330px) 1fr; gap: 18px; }
@media (max-width: 760px) { .task-pane { grid-template-columns: 1fr; } }

.task-cal { padding: 14px; }
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cal-title { font-weight: 700; font-size: 15px; color: var(--text); }
.cal-nav {
  width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg-1); color: var(--text-2); cursor: pointer; font-size: 12px;
}
.cal-nav:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

.cal-week, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-week { font-size: 11px; color: var(--text-2); text-align: center; padding: 4px 0 6px; }
.cal-week div { padding: 2px 0; }

.cal-cell {
  aspect-ratio: 1/1; border-radius: 8px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; cursor: pointer;
  background: var(--bg-1); border: 1px solid transparent; color: var(--text-2);
  font-size: 13px; transition: all 0.12s; position: relative;
}
.cal-cell:hover { background: var(--bg-hover); }
.cal-cell .cal-day { font-weight: 500; }
.cal-cell .cal-status { line-height: 0; }
.cal-cell.other { color: var(--text-3); opacity: 0.55; }
.cal-cell.today { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.cal-cell.today .cal-day { background: var(--accent); color: #fff; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; }
.cal-cell.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.cal-cell.st-allDone { background: rgba(34,197,94,0.12); color: #15803d; }
.cal-cell.st-partial { background: rgba(234,179,8,0.16); color: #a16207; }
.cal-cell.st-planned { background: rgba(59,130,246,0.14); color: #1d4ed8; }
.cal-cell.st-pastUndone { background: rgba(239,68,68,0.14); color: #b91c1c; }

.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; }
.dot-allDone { background: #22c55e; }
.dot-partial { background: #eab308; }
.dot-pastUndone { background: #ef4444; }
.dot-planned { background: #3b82f6; }

.cal-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-2); }
.cal-legend span { display: flex; align-items: center; gap: 4px; }

/* 当日详情面板 */
.task-detail { display: flex; flex-direction: column; padding: 18px; }
.detail-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.detail-title { font-size: 22px; font-weight: 700; color: var(--text); }
.detail-sub { color: var(--text-2); font-size: 13px; }
.detail-actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }

.task-progress { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.prog-bar { flex: 1; height: 8px; background: var(--bg-1); border-radius: 4px; overflow: hidden; }
.prog-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #22c55e); transition: width 0.2s; }
.prog-label { font-size: 12px; color: var(--text-2); white-space: nowrap; }

.task-item { align-items: center; }
.task-item .item-meta { color: var(--accent); font-weight: 500; }
.task-note { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--border); }
.task-note-label { font-size: 12px; color: var(--text-2); margin-bottom: 6px; font-weight: 500; }
.task-note textarea {
  width: 100%; box-sizing: border-box; background: var(--bg-1); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 13px; font-family: inherit;
  resize: vertical; min-height: 60px;
}
.task-note textarea:focus { outline: none; border-color: var(--accent); }

  /* 习惯打卡 */
  .habit-list { background: var(--bg-3); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .habit-row {
    display: grid; grid-template-columns: minmax(120px, 200px) 1fr; gap: 16px; align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .habit-row:last-child { border-bottom: none; }
  .habit-left .h-name { font-size: 15px; font-weight: 600; color: var(--text); }
  .habit-left .h-sub { font-size: 12px; color: var(--text-2); margin-top: 4px; }
  .habit-controls { display: flex; gap: 14px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
  .cup-check, .check-toggle {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    font-size: 13px; color: var(--text-2); user-select: none;
  }
  .cup-check input, .check-toggle input {
    width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent);
  }
  .cup-check.done, .check-toggle.done { color: var(--text); font-weight: 500; }
  .habit-time {
    padding: 5px 8px; border: 1px solid var(--border-strong); border-radius: 6px;
    font-size: 13px; background: var(--bg-1); outline: none;
  }
  .habit-time:focus { border-color: var(--accent); }
  .habit-note {
    padding: 5px 12px; border: 1px solid var(--border-strong); border-radius: 6px;
    font-size: 13px; background: var(--bg-1); width: 160px; outline: none;
  }
  .habit-note:focus { border-color: var(--accent); }
  .habit-7d {
    width: 100%; border-collapse: collapse; font-size: 13px;
  }
  .habit-7d th, .habit-7d td {
    padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border);
  }
  .habit-7d th { color: var(--text-2); font-weight: 500; font-size: 12px; text-align: right; }
  .habit-7d th:first-child { text-align: left; color: var(--text); font-weight: 600; }
  .habit-7d td { text-align: right; color: var(--text-3); }
  .habit-7d td:first-child { text-align: left; color: var(--text); }
  .habit-7d td.done { color: var(--success); font-weight: 600; }
  .habit-7d tr.today td:first-child { color: var(--accent); font-weight: 600; }
  .habit-7d tr:last-child td { border-bottom: none; }

  /* 复盘 */
  .replay-card { padding: 22px 24px; }
  .replay-today-tag { font-size: 13px; color: var(--text-2); margin-bottom: 16px; }
  .replay-kiss { display: flex; flex-direction: column; }
  .kiss-block {
    padding: 14px 0 10px;
    border-bottom: 1px dashed var(--border);
  }
  .kiss-block:last-of-type { border-bottom: none; }
  .kiss-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .kiss-hint { font-size: 12px; color: var(--text-2); margin-bottom: 10px; }
  .kiss-ta {
    width: 100%; border: 1px solid var(--border-strong); border-radius: 8px;
    padding: 10px 12px; font-size: 14px; line-height: 1.6;
    background: var(--bg-1); color: var(--text); resize: vertical; outline: none;
    min-height: 44px; font-family: inherit;
  }
  .kiss-ta:focus { border-color: var(--accent); }
  .kiss-add {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; margin-top: 8px;
    border: 1px solid var(--border-strong); border-radius: 50%;
    color: var(--text-2); font-size: 18px; cursor: pointer;
    transition: all 0.15s;
  }
  .kiss-add:hover { border-color: var(--accent); color: var(--accent); }
  .kiss-mood { padding-top: 18px; margin-top: 6px; border-top: 1px solid var(--border); }
  .mood-picker { display: flex; gap: 14px; align-items: center; margin-top: 10px; }
  .mood-btn {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--bg-1); cursor: pointer; font-size: 26px;
    transition: all 0.15s; line-height: 1;
  }
  .mood-btn:hover { transform: scale(1.05); border-color: var(--accent); }
  .mood-btn.active { background: var(--accent-soft); border-color: var(--accent); transform: scale(1.1); }

  /* 信息日报 */
  .news-block { padding: 14px 16px; }
  .news-block .src { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .news-block .nt { font-size: 15px; color: var(--text); margin-bottom: 4px; display: block; }
  a.news-block .nt, .news-block a.nt { color: var(--text); }
  .news-block a.nt:hover { color: var(--accent); }
  .news-block .nl { color: var(--text-2); font-size: 12px; word-break: break-all; display: block; margin-top: 4px; }
  .news-block .ndesc { font-size: 12px; color: var(--text-2); margin-top: 6px; line-height: 1.5; }

  .news-summary {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    background: var(--bg-3); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 20px; margin-bottom: 18px;
  }
  .news-summary > div { display: flex; flex-direction: column; align-items: flex-start; }
  .news-summary .big-num { font-size: 26px; font-weight: 800; color: var(--accent); line-height: 1; }
  .news-summary .lab { font-size: 12px; color: var(--text-2); margin-top: 6px; }

  .news-toolbar { flex-wrap: wrap; }
  .news-rss-hint {
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    font-size: 12px; color: var(--text-2); margin: 10px 0 16px;
  }
  .news-rss-hint .tag { font-size: 11px; }

  /* 复盘 */
  .replay-block { background: var(--bg-3); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .replay-block .day { font-size: 16px; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
  .replay-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .replay-cell { padding: 10px 12px; background: var(--bg-1); border-radius: 8px; border-left: 3px solid var(--accent); }
  .replay-cell:nth-child(1) { border-left-color: var(--success); }
  .replay-cell:nth-child(2) { border-left-color: var(--warning); }
  .replay-cell:nth-child(3) { border-left-color: var(--accent); }
  .replay-cell:nth-child(4) { border-left-color: var(--danger); }
  .replay-cell .lab { font-size: 11px; color: var(--text-3); margin-bottom: 2px; }
  .replay-cell .val { font-size: 14px; color: var(--text); white-space: pre-wrap; word-break: break-word; }
  .replay-block .emo { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
  .replay-block .emo .scale { display: inline-block; padding: 2px 10px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 600; }

  /* 影视库 */
  .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .media-card {
    background: var(--bg-3); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; display: flex; flex-direction: column; gap: 8px;
  }
  .media-card.media-clean {
    border-left: 4px solid var(--accent);
  }
  .media-card .poster {
    aspect-ratio: 2/3; background: var(--bg-1); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; font-size: 38px; margin-bottom: 8px;
  }
  .media-card .m-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .media-card .m-sub { font-size: 11px; color: var(--text-2); }
  .media-card .m-rating { color: var(--warning); font-size: 13px; letter-spacing: 1px; }
  .media-card .actions { display: flex; gap: 6px; margin-top: auto; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; background: var(--accent-soft); color: var(--accent); }
  .tag.gray { background: rgba(107,114,128,0.12); color: var(--text-2); }
  .tag.green { background: rgba(16,185,129,0.12); color: var(--success); }

  /* 设置 */
  .set-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .set-card .section-title { margin-bottom: 12px; }

.sync-indicator { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 6px; background: var(--bg-1); border: 1px solid var(--border); font-size: 12px; cursor: pointer; color: var(--text-2); }
.sync-indicator:hover { background: var(--bg-hover); }
.si-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
.si-dot.on { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,0.18); }
.si-dot.off { background: #cbd5e1; }
.si-dot.busy { background: #3b82f6; animation: si-pulse 1s infinite; }
@keyframes si-pulse { 0% { box-shadow: 0 0 0 0 rgba(59,130,246,0.5); } 100% { box-shadow: 0 0 0 6px rgba(59,130,246,0); } }
  .set-grid { display: grid; grid-template-columns: 120px 1fr; gap: 10px; align-items: center; margin-top: 4px; }
  .set-grid > div:not(.set-label):not(input):not(select) { }
  .set-actions { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .hint { font-size: 12px; color: var(--text-3); margin-top: 12px; line-height: 1.7; }
  .hint code { color: var(--accent); }
  .sync-status { display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .sync-status.on { background: rgba(16,185,129,0.12); color: var(--success); }
  .sync-status.off { background: rgba(107,114,128,0.12); color: var(--text-2); }

  /* 弹窗 */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(17,24,39,0.4); z-index: 100;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: var(--bg-2); border: 1px solid var(--border-strong); border-radius: 16px;
    padding: 22px; width: 100%; max-width: 480px; box-shadow: 0 20px 60px rgba(0,0,0,0.18);
  }
  .modal h3 { margin-bottom: 14px; font-size: 17px; font-weight: 600; }
  .modal .form-row { margin-bottom: 12px; }
  .modal label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 4px; }
  .modal input, .modal textarea, .modal select {
    width: 100%; background: var(--bg-1); border: 1px solid var(--border);
    padding: 9px 12px; border-radius: 8px; color: var(--text); outline: none; font-size: 14px;
  }
  .modal input:focus, .modal textarea:focus, .modal select:focus { border-color: var(--accent); }
  .modal .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }

  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(40px);
    background: #1F2937; color: #fff; padding: 10px 18px; border-radius: 10px;
    font-size: 14px; opacity: 0; transition: transform 0.3s, opacity 0.3s; z-index: 200;
    box-shadow: 0 12px 30px rgba(0,0,0,0.2); max-width: 80vw;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* ============== 移动端底部导航 ============== */
  .mobile-nav { display: none; }

  @media (max-width: 1100px) {
    .feature-grid { grid-template-columns: repeat(3, 1fr); }
    .habit-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .main { padding: 22px 16px 92px; }
    .greeting { margin: 14px 0 36px; }
    .greeting .slogan { font-size: 32px; }
    .habit-row { grid-template-columns: 1fr; gap: 10px; padding: 14px 16px; }
    .habit-controls { justify-content: flex-start; }
    .feature-grid { grid-template-columns: repeat(2, 1fr); }
    .page-sub { margin-left: 0; }
    .page-head .big-icon { width: 48px; height: 48px; font-size: 22px; }
    .replay-grid { grid-template-columns: 1fr; }
    .mobile-nav {
      display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 60;
      background: #FFFFFF; border-top: 1px solid var(--border);
      overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 6px 4px;
      padding-bottom: calc(6px + env(safe-area-inset-bottom));
    }
    .mobile-nav button {
      flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 6px 14px; color: var(--text-2); font-size: 10px; min-width: 56px;
    }
    .mobile-nav button .mi { font-size: 19px; line-height: 1; }
    .mobile-nav button.active { color: var(--accent); }
    .mobile-nav::-webkit-scrollbar { display: none; }
  }
</style>
</head>

<div class="modal-mask" id="modal"><div class="modal" id="modal-inner"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ===================== 数据层 ===================== */
const DB_KEY = 'j_workbench_v1';

const DEFAULT_DATA = {
  profile: { name: '计俊杰', slogan: '需要进步' },
  countdowns: [ { id: cid(), title: '26下学期六级考试', date: '2026-12-13' } ],
  tasks: [],
  captures: [],
  habits: [
    { id: 'h-water', name: '喝水', emoji: '💧', sub: '早 / 中 / 晚 各一杯', kind: 'water', cups: 3, log: {} },
    { id: 'h-read',  name: '阅读', emoji: '📖', sub: '≥ 30 分钟',           kind: 'check', log: {} },
    { id: 'h-exer',  name: '运动', emoji: '🏃', sub: '≥ 30 分钟(健身/骑行等)', kind: 'check', hasNote: true, log: {} },
    { id: 'h-sleep', name: '早睡', emoji: '🛌', sub: '昨晚 23:00 前入睡',   kind: 'check', hasTime: true, log: {} },
    { id: 'h-wake',  name: '早起', emoji: '🌅', sub: '记录早起',           kind: 'check', hasTime: true, log: {} }
  ],
  news: [],
  replay: [],
  media: [],
  page: 'home'
};

function cid() { return 'c' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

function loadDB() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (!raw) return JSON.parse(JSON.stringify(DEFAULT_DATA));
    const data = JSON.parse(raw);
    return { ...DEFAULT_DATA, ...data, profile: { ...DEFAULT_DATA.profile, ...(data.profile || {}) } };
  } catch (e) { return JSON.parse(JSON.stringify(DEFAULT_DATA)); }
}
function saveDB() {
  try { localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
  catch (e) { toast('保存失败：' + e.message); }
  scheduleSync();
}

let DB = loadDB();

/* ===================== 云同步（GitHub Gist） ===================== */
const SYNC = {
  token: localStorage.getItem('jwb_gist_token') || '',
  gistId: localStorage.getItem('jwb_gist_id') || '',
  auto: localStorage.getItem('jwb_autosync') !== '0',
  lastSyncAt: 0,
  lastRemoteUpdatedAt: '',
  syncing: false
};
function saveSyncCreds() {
  localStorage.setItem('jwb_gist_token', SYNC.token);
  localStorage.setItem('jwb_gist_id', SYNC.gistId);
  localStorage.setItem('jwb_autosync', SYNC.auto ? '1' : '0');
}
let _syncTimer = null;
function scheduleSync() {
  if (!SYNC.auto || !SYNC.token) return;
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(() => gistSave(false), 1200);
}

async function gistFindExisting() {
  // 用 token 列出用户私有 Gist，找名为 "J Workbench Data" 的那条并返回 id
  if (!SYNC.token) return null;
  try {
    const res = await fetch('https://api.github.com/gists?per_page=100', {
      headers: { 'Authorization': `Bearer ${SYNC.token}`, 'Accept': 'application/vnd.github+json' }
    });
    if (!res.ok) return null;
    const arr = await res.json();
    const found = arr.find(g => g.description === 'J Workbench Data');
    return found ? found.id : null;
  } catch (e) { return null; }
}

async function gistSave(showToast = true, force = false) {
  if (!SYNC.token) { if (showToast) toast('请先在设置中连接云端'); return false; }
  if (SYNC.syncing && !force) return false;
  SYNC.syncing = true;
  try {
    if (!SYNC.gistId) {
      // 自动发现已存在的 Gist（多设备共享用）
      const found = await gistFindExisting();
      if (found) {
        SYNC.gistId = found;
        saveSyncCreds();
        if (showToast) toast('已找到现有云端存储');
      }
    }
    const url = SYNC.gistId ? `https://api.github.com/gists/${SYNC.gistId}` : 'https://api.github.com/gists';
    const method = SYNC.gistId ? 'PATCH' : 'POST';
    const body = { files: { 'workbench.json': { content: JSON.stringify(DB, null, 2) } } };
    if (!SYNC.gistId) { body.description = 'J Workbench Data'; body.public = false; }
    const res = await fetch(url, {
      method,
      headers: { 'Authorization': `Bearer ${SYNC.token}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github+json' },
      body: JSON.stringify(body)
    });
    if (!res.ok) { const j = await res.json().catch(()=>({})); throw new Error((j.message) || ('HTTP ' + res.status)); }
    const data = await res.json();
    if (!SYNC.gistId) SYNC.gistId = data.id;
    SYNC.lastSyncAt = Date.now();
    SYNC.lastRemoteUpdatedAt = data.updated_at || '';
    saveSyncCreds();
    updateSyncBadge();
    if (showToast) toast('✓ 已同步到云端');
    return true;
  } catch (e) { if (showToast) toast('同步失败：' + e.message); return false; }
  finally { SYNC.syncing = false; }
}

async function gistLoad(showToast = true) {
  if (!SYNC.token) { if (showToast) toast('请先在设置中连接云端'); return false; }
  if (!SYNC.gistId) {
    // 自动发现
    const found = await gistFindExisting();
    if (found) {
      SYNC.gistId = found; saveSyncCreds();
      if (showToast) toast('已找到现有云端存储');
    } else {
      if (showToast) toast('尚未创建云端存储，请先点「上传到云端」');
      return false;
    }
  }
  try {
    const res = await fetch(`https://api.github.com/gists/${SYNC.gistId}`, {
      headers: { 'Authorization': `Bearer ${SYNC.token}`, 'Accept': 'application/vnd.github+json' }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const content = data.files['workbench.json'] ? data.files['workbench.json'].content : null;
    if (!content) throw new Error('云端暂无可读数据');
    const parsed = JSON.parse(content);
    // 合并：保留本地未同步的更改（简单的全量替换，因为本工具的数据多为轻量文本）
    DB = { ...DEFAULT_DATA, ...parsed, profile: { ...DEFAULT_DATA.profile, ...(parsed.profile || {}) }, taskNotes: parsed.taskNotes || {} };
    SYNC.lastSyncAt = Date.now();
    SYNC.lastRemoteUpdatedAt = data.updated_at || '';
    saveDB();
    saveSyncCreds();
    updateSyncBadge();
    if (showToast) toast('✓ 已从云端加载（覆盖本地）');
    render();
    return true;
  } catch (e) { if (showToast) toast('加载失败：' + e.message); return false; }
}

// 后台静默拉取：仅在远端 updated_at 更新时覆盖本地
async function gistPoll() {
  if (!SYNC.token || !SYNC.gistId) return;
  if (Date.now() - SYNC.lastSyncAt < 5000) return; // 节流：5s 内不重复拉取
  try {
    const res = await fetch(`https://api.github.com/gists/${SYNC.gistId}`, {
      headers: { 'Authorization': `Bearer ${SYNC.token}`, 'Accept': 'application/vnd.github+json' }
    });
    if (!res.ok) return;
    const meta = await res.json();
    if (meta.updated_at && meta.updated_at !== SYNC.lastRemoteUpdatedAt) {
      // 远端有变化 → 拉取并提示
      const content = meta.files['workbench.json'] ? meta.files['workbench.json'].content : null;
      if (!content) return;
      const parsed = JSON.parse(content);
      DB = { ...DEFAULT_DATA, ...parsed, profile: { ...DEFAULT_DATA.profile, ...(parsed.profile || {}) }, taskNotes: parsed.taskNotes || {} };
      SYNC.lastRemoteUpdatedAt = meta.updated_at;
      SYNC.lastSyncAt = Date.now();
      saveDB();
      saveSyncCreds();
      updateSyncBadge();
      toast('☁️ 检测到云端更新，已自动同步');
      render();
    }
  } catch (e) { /* 静默失败，下次再试 */ }
}

function updateSyncBadge() {
  const el = document.querySelector('.sync-indicator');
  if (!el) return;
  if (!SYNC.token || !SYNC.gistId) {
    el.innerHTML = '<span class="si-dot off"></span><span>未连接</span>';
    return;
  }
  const last = SYNC.lastSyncAt ? new Date(SYNC.lastSyncAt).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) : '—';
  el.innerHTML = '<span class="si-dot ' + (SYNC.syncing ? 'busy' : 'on') + '"></span><span>已同步 · ' + last + '</span>';
  el.onclick = () => gistLoad(true);
}

async function manualSync() {
  if (!SYNC.token) { toast('请先填写 GitHub Token'); return; }
  toast(SYNC.gistId ? '🔄 正在双向同步…' : '🔄 正在连接云端…');
  // 先 pull 再 push，避免覆盖远端更新
  if (SYNC.gistId) await gistLoad(false);
  await gistSave(false, true);
  render();
}

/* ===================== 工具 ===================== */
function $(s) { return document.querySelector(s); }
function $$(s) { return [...document.querySelectorAll(s)]; }
function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'style') Object.assign(e.style, attrs[k]);
    else if (k.startsWith('on') && typeof attrs[k] === 'function') e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k === 'data') for (const dk in attrs.data) e.dataset[dk] = attrs.data[dk];
    else if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]);
  }
  children.flat().forEach(c => {
    if (c === undefined || c === null) return;
    if (typeof c === 'string' || typeof c === 'number') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}
function fmtDate(dStr) {
  if (!dStr) return '';
  const d = new Date(dStr + 'T00:00:00');
  const wk = ['日','一','二','三','四','五','六'][d.getDay()];
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} · 周${wk}`;
}
function daysBetween(target) {
  const today = new Date(); today.setHours(0,0,0,0);
  const t = new Date(target + 'T00:00:00');
  return Math.round((t - today) / (1000*60*60*24));
}
function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function shiftDateKey(dateKey, delta) {
  const [y, m, d] = dateKey.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + delta);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
function fmtDateTime(ts) {
  const d = new Date(ts);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function toast(msg, dur = 2200) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), dur);
}

/* ===================== 路由 ===================== */
function goto(page) {
  DB.page = page; saveDB();
  updateNavActive();
  render();
}
function updateNavActive() {
  $$('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === DB.page));
  $$('.mobile-nav button').forEach(b => b.classList.toggle('active', b.dataset.page === DB.page));
}

/* ===================== 主页 ===================== */
function renderHome() {
  const wrap = el('div');
  wrap.appendChild(el('div', { class: 'greeting' },
    el('div', { class: 'name', onclick: () => editProfile('name'), title: '点击修改' }, DB.profile.name),
    el('div', { class: 'slogan', onclick: () => editProfile('slogan'), title: '点击修改' }, DB.profile.slogan)
  ));
  // 倒数日
  wrap.appendChild(el('div', { class: 'section' },

/* ===================== 每日任务（月历 + 当日 + 自动顺延） ===================== */
let TASK_VIEW = { year: 0, month: 0, day: '' }; // 0 表示"今天"

function carryOverTasks() {
  const today = todayKey();
  let changed = false;
  const toAdd = [];
  DB.tasks.forEach(t => {
    if (!t.date) {
      // 迁移老数据：日期从 createdAt 推断
      const d = t.createdAt ? new Date(t.createdAt) : new Date();
      t.date = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      changed = true;
    }
    if (t.date < today && !t.done) {
      // 把过期未完成的任务顺延到今天（保留原日期作为 carriedFrom 标记）
      toAdd.push({
        id: cid(),
        date: today,
        time: t.time || '',
        text: t.text,
        done: false,
        carriedFrom: t.date,
        originId: t.id,
        createdAt: Date.now()
      });
      changed = true;
    }
  });
  if (toAdd.length) DB.tasks.push(...toAdd);
  if (changed) saveDB();
  return toAdd.length;
}

function dayStatus(dateKey) {
  // 返回该日任务状态：'none' | 'planned' | 'allDone' | 'partial' | 'pastUndone'
  const list = DB.tasks.filter(t => t.date === dateKey);
  if (list.length === 0) return 'none';
  const today = todayKey();
  const doneCount = list.filter(t => t.done).length;
  if (doneCount === list.length) return 'allDone';
  if (doneCount === 0) return dateKey < today ? 'pastUndone' : 'planned';
  return 'partial';
}

}

function buildDayCell(year, month, day, key, otherMonth) {
  const today = todayKey();
  const status = dayStatus(key);
  const selected = TASK_VIEW.day === key;
  const isToday = key === today;
  const cell = el('div', {
    class: 'cal-cell' +
      (otherMonth ? ' other' : '') +
      (selected ? ' selected' : '') +
      (isToday ? ' today' : '') +
      (status !== 'none' ? ' st-' + status : ''),
    onclick: () => { TASK_VIEW.day = key; render(); }
  }, el('div', { class: 'cal-day' }, day));
  if (status !== 'none' && !otherMonth) {
    cell.appendChild(el('div', { class: 'cal-status' }, statusDot(status)));
  }
  return cell;
}

function statusDot(status) {
  if (status === 'allDone') return el('span', { class: 'dot dot-allDone', title: '全部完成' });
  if (status === 'partial') return el('span', { class: 'dot dot-partial', title: '部分完成' });
  if (status === 'planned') return el('span', { class: 'dot dot-planned', title: '已制定' });
  if (status === 'pastUndone') return el('span', { class: 'dot dot-pastUndone', title: '未完成' });
  return null;
}

function shiftMonth(delta) {
  const [y, m] = TASK_VIEW.day.split('-').map(Number);
  let ny = y, nm = m + delta;
  if (nm < 1) { ny--; nm = 12; } else if (nm > 12) { ny++; nm = 1; }
  // 月份变了，但保持选中同一天（如果该月没有则取末日）
  const daysInNew = new Date(ny, nm, 0).getDate();
  const curD = parseInt(TASK_VIEW.day.split('-')[2], 10);
  const nd = Math.min(curD, daysInNew);
  TASK_VIEW.day = `${ny}-${String(nm).padStart(2,'0')}-${String(nd).padStart(2,'0')}`;
  render();
}

function gotoYesterday() {
  TASK_VIEW.day = shiftDateKey(TASK_VIEW.day, -1);
  render();
}
function gotoTomorrow() {
  TASK_VIEW.day = shiftDateKey(TASK_VIEW.day, 1);
  render();
}
function goToToday() {
  TASK_VIEW.day = todayKey();

function weekdayLabel(dateKey) {
  const [y, m, d] = dateKey.split('-').map(Number);
  const names = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  return names[new Date(y, m - 1, d).getDay()];
}

const HABIT_COL_HEADS = ['水','读','动','睡','起','成']; // 表格列标题

function isHabitDone(logVal) {
  if (logVal === undefined || logVal === null) return false;
  if (typeof logVal === 'object') return !!logVal.done;
  return !!logVal;
}
function getLogObj(h, day) {
  let v = h.log[day];
  if (v === undefined || v === null) return null;
  if (typeof v === 'object') return v;
  // 旧数据：true => {done:true}
  return { done: !!v };
}

function renderHabitRow(h, today) {
  if (h.kind === 'water') {
    let log = h.log[today];
    if (!log || typeof log !== 'object' || !Array.isArray(log.cups)) {
      log = { cups: [false, false, false] };
      h.log[today] = log;
    }
    const labels = ['早一杯', '午一杯', '晚一杯'];
    const checks = el('div', { style: { display: 'flex', gap: '14px', flexWrap: 'wrap' } });
    labels.forEach((label, i) => {
      const wrapL = el('label', { class: 'cup-check' + (log.cups[i] ? ' done' : '') },
        el('input', { type: 'checkbox', checked: log.cups[i], onchange: (e) => {
          log.cups[i] = e.target.checked;
          saveDB();
          wrapL.classList.toggle('done', e.target.checked);
          refreshHabitTable();
        }}),
        el('span', {}, label)
      );
      checks.appendChild(wrapL);
    });
    return el('div', { class: 'habit-row' },
      el('div', { class: 'habit-left' },
        el('div', { class: 'h-name' }, `${h.emoji} ${h.name}`),
        el('div', { class: 'h-sub' }, h.sub)
      ),
      el('div', { class: 'habit-controls' }, checks)
    );
  }

  // 普通 check 类型
  let l = getLogObj(h, today);
  const isDone = isHabitDone(l);
  const check = el('label', { class: 'check-toggle' + (isDone ? ' done' : '') },
    el('input', { type: 'checkbox', checked: isDone, onchange: (e) => {
      const v = e.target.checked;
      if (!h.log[today] || typeof h.log[today] !== 'object') h.log[today] = {};
      h.log[today].done = v;
      if (!v && !h.hasTime && !h.hasNote) delete h.log[today];
      saveDB();
      check.classList.toggle('done', v);
      refreshHabitTable();
    }})
  );

  const extras = [];
  if (h.hasTime) {
    const tval = (l && l.time) || '';
    const ti = el('input', { type: 'time', value: tval, class: 'habit-time', onchange: (e) => {
      if (!h.log[today] || typeof h.log[today] !== 'object') h.log[today] = { done: true };
      h.log[today].time = e.target.value;
      saveDB();
      refreshHabitTable();
    }});
    extras.push(ti);
  }
  if (h.hasNote) {
    const nval = (l && l.note) || '';
    const ni = el('input', { type: 'text', value: nval, placeholder: '类型(可选)', class: 'habit-note', onchange: (e) => {

      h.log[today].note = e.target.value;
      saveDB();
      refreshHabitTable();
    }});
    extras.push(ni);
  }

  return el('div', { class: 'habit-row' },
    el('div', { class: 'habit-left' },
      el('div', { class: 'h-name' }, `${h.emoji} ${h.name}`),
      el('div', { class: 'h-sub' }, h.sub)

  );
}

function buildHabitTableHTML() {

    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    days.push({ key, label: `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`, wd: wdNames[(d.getDay()+6)%7], isToday: i === 0 });
  }

  headRow.appendChild(el('th', {}, '日期'));

    const tr = el('tr', { class: d.isToday ? 'today' : '' });
    tr.appendChild(el('td', {}, `${d.label} ${d.isToday ? '(今天)' : ''}`));
    display.forEach(h => {

        const arr = (log && Array.isArray(log.cups)) ? log.cups : [];
        const n = arr.filter(Boolean).length;
        txt = `${n}/3`;
        if (n > 0) cls = 'done';
      } else {
        const done = isHabitDone(log);
        if (done) { txt = '✓'; cls = 'done'; } else txt = '·';
      }
      tr.appendChild(el('td', { class: cls, title: h.name + (typeof log === 'object' ? ' ' + (log?.time||'') + ' ' + (log?.note||'') : '') }, txt));
    });
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  return tbl;
}

const NEWS_JSON_URL = 'https://j-dominate.github.io/j-workbench/news.json';

async function importTodayNews() {
  const btn = $('#fetchNewsBtn');
  if (!btn) return;
  const origTxt = '🔄 一键抓取今日要闻（≥10 条）';
  btn.disabled = true;
  btn.textContent = '⏳ 正在拉取最新要闻...';
  let data = null;
  try {
    const r = await fetch(NEWS_JSON_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    data = await r.json();
  } catch (e) {
    console.warn('news.json 拉取失败', e);
  }
  if (!data || !Array.isArray(data.items) || data.items.length === 0) {
    toast('暂无可拉取的要闻：聚合数据可能正在生成，稍后重试');
    btn.disabled = false;
    btn.textContent = origTxt;
    return;
  }
  const today = todayKey();
  const existingKey = new Set(
    DB.news.filter(n => n.date === today).map(n => (n.source + '|' + n.title).replace(/\s+/g, '').slice(0, 60))
  );
  let added = 0;
  data.items.forEach(n => {
    const k = (n.source + '|' + n.title).replace(/\s+/g, '').slice(0, 60);
    if (existingKey.has(k)) return;
    DB.news.push({
      id: cid(),
      source: n.source,
      cat: n.cat,
      title: n.title,
      link: n.link,
      desc: n.desc || '',
      ts: n.ts || Date.now(),
      imported: true,
      date: today
    });
    existingKey.add(k);
    added++;
  });
  saveDB();
  render();
  toast(`已拉取 ${data.items.length} 条，新增 ${added} 条`);
  btn.disabled = false;
  btn.textContent = `✓ 已更新（最新 ${data.items.length} 条 / 新增 ${added}）`;
  setTimeout(() => { btn.textContent = origTxt; }, 6000);
}

function renderMoodCurve() {
  // 最近 30 天
  const days = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - i);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const r = DB.replay.find(x => x.date === key);
    const m = r ? Number(r.mood) : 0;
    days.push({ key, label: String(d.getDate()), m });
  }
  const W = 720, H = 130;
  const padL = 30, padR = 10, padT = 12, padB = 22;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const xStep = plotW / Math.max(1, days.length - 1);
  const yFor = m => m === 0 ? null : padT + plotH * (1 - (m - 1) / 4); // 1->bottom, 5->top
  // 网格线 + Y 标签（1-5）
  const svgChildren = [];
  for (let v = 1; v <= 5; v++) {
    const y = padT + plotH * (1 - (v - 1) / 4);
    svgChildren.push(`<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#E5E7EB" stroke-dasharray="3,3" />`);
    svgChildren.push(`<text x="${padL - 6}" y="${y + 4}" text-anchor="end" font-size="10" fill="#9CA3AF">${v}</text>`);
  }
  // X 轴标签：每 5 天一个
  days.forEach((d, i) => {
    if (i % 5 !== 0 && i !== days.length - 1) return;
    const x = padL + xStep * i;
    svgChildren.push(`<text x="${x}" y="${H - 6}" text-anchor="middle" font-size="10" fill="#9CA3AF">${d.label}</text>`);
  });
  // 折线（跳过 mood=0）
  const points = days.map((d, i) => ({ x: padL + xStep * i, y: yFor(d.m), v: d.m }));
  // 段：只在连续有点的情况下连线
  for (let i = 1; i < points.length; i++) {
    if (points[i-1].y !== null && points[i].y !== null) {
      svgChildren.push(`<line x1="${points[i-1].x}" y1="${points[i-1].y}" x2="${points[i].x}" y2="${points[i].y}" stroke="#3B82F6" stroke-width="2" />`);
    }
  }
  // 点
  points.forEach((p) => {
    if (p.y === null) return;
    svgChildren.push(`<circle cx="${p.x}" cy="${p.y}" r="4" fill="#3B82F6" stroke="#fff" stroke-width="2" />`);
  });
  const svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;">${svgChildren.join('')}</svg>`;
  return svg;
}

function cell(label, value) {
  return el('div', { class: 'replay-cell' }, el('div', { class: 'lab' }, label), el('div', { class: 'val' }, value || '—'));
}

/* ===================== 影视库 ===================== */
function renderMedia(filter = 'all') {
  const wrap = el('div');
  wrap.appendChild(pageHeader('🎬', '影视库', '想看 / 已看'));
  wrap.appendChild(el('div', { class: 'toolbar' },
    el('button', { class: 'btn', onclick: addMediaDialog }, '+ 添加'),
    el('select', { id: 'media-filter', onchange: (e) => renderMedia(e.target.value) },
      el('option', { value: 'all' }, '全部'), el('option', { value: 'want' }, '想看'), el('option', { value: 'done' }, '已看'))
  ));
  const items = filter === 'all' ? DB.media : DB.media.filter(m => m.status === filter);
  if (items.length === 0) {
    wrap.appendChild(el('div', { class: 'empty' }, el('div', { class: 'big' }, '🎬'), el('div', {}, '影视库还没有内容。')));
    return wrap;
  }
  const grid = el('div', { class: 'media-grid' });
  items.forEach(m => {
    grid.appendChild(el('div', { class: 'media-card media-clean' },
      el('div', { class: 'm-title' }, m.title),
      el('div', { class: 'm-sub' }, (m.type === 'series' ? '剧集' : '电影') + (m.year ? ` · ${m.year}` : '')),
      el('div', { style: { display: 'flex', gap: '6px', flexWrap: 'wrap', marginTop: '8px' } },
        el('span', { class: 'tag ' + (m.status === 'done' ? 'green' : 'gray') }, m.status === 'done' ? '已看' : '想看'),
        m.note ? el('span', { class: 'tag gray', style: { maxWidth: '160px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }, title: m.note }, m.note) : null
      ),
      el('div', { class: 'actions' },
        el('button', { class: 'btn-ghost', style: { padding: '6px 10px', fontSize: '12px', borderRadius: '6px', border: '1px solid var(--border-strong)' }, onclick: () => toggleMediaStatus(m.id) }, m.status === 'done' ? '移回想看' : '标记已看'),
        el('button', { class: 'btn-ghost', style: { padding: '6px 10px', fontSize: '12px', borderRadius: '6px', border: '1px solid var(--border-strong)', color: 'var(--danger)' }, onclick: () => deleteItem('media', m.id) }, '删除')
      )
    ));
  });
  wrap.appendChild(grid);
  return wrap;
}
function toggleMediaStatus(id) {
  const m = DB.media.find(x=>x.id===id); m.status = m.status === 'done' ? 'want' : 'done';
  saveDB(); render();
}
function addMediaDialog() {
  openModal('添加影视', (content, actions) => {
    content.appendChild(formRow('标题', input({ id: 'm-title', placeholder: '片名' })));
    content.appendChild(formRow('类型', el('select', { id: 'm-type' }, el('option', { value: 'movie' }, '电影'), el('option', { value: 'series' }, '剧集'))));
    content.appendChild(formRow('年份', input({ id: 'm-year', type: 'number', placeholder: '2024', min: '1900', max: '2100' })));
    content.appendChild(formRow('状态', el('select', { id: 'm-status' }, el('option', { value: 'want' }, '想看'), el('option', { value: 'done' }, '已看'))));
    content.appendChild(formRow('短评 / 备注', (() => { const t = el('textarea', { id: 'm-note', rows: '2', placeholder: '一句话...' }); return t; })()));
    actions.appendChild(button('添加', { onclick: () => {
      const title = $('#m-title').value.trim(); if (!title) { toast('请填写标题'); return; }
      DB.media.push({ id: cid(), title, type: $('#m-type').value, year: $('#m-year').value ? Number($('#m-year').value) : null, status: $('#m-status').value, note: $('#m-note').value.trim() });
      saveDB(); closeModal(); toast('已添加'); render();
    }}));
  });
}

/* ===================== 设置 ===================== */
function renderSettings() {
  const wrap = el('div');
  wrap.appendChild(pageHeader('⚙️', '设置', '个人信息 + 云同步 + 数据管理'));

  // 个人信息
  const c1 = el('div', { class: 'set-card' },
    el('div', { class: 'section-title' }, el('span', { class: 'ico' }, '👤'), el('span', {}, '个人信息')),
    el('div', { class: 'set-grid' },
      el('div', { class: 'set-label' }, '姓名：'),
      input({ id: 'set-name', value: DB.profile.name, oninput: (e) => { DB.profile.name = e.target.value; saveDB(); } }),
      el('div', { class: 'set-label' }, '标语：'),
      input({ id: 'set-slogan', value: DB.profile.slogan, oninput: (e) => { DB.profile.slogan = e.target.value; saveDB(); } })
    )
  );
  wrap.appendChild(c1);

  // 云同步
  const syncOn = SYNC.token && SYNC.gistId;
  const c2 = el('div', { class: 'set-card' },
    el('div', { class: 'section-title' },
      el('span', { class: 'ico' }, '☁️'), el('span', {}, '云端同步（跨设备共享）'),
      el('span', { class: 'sync-status ' + (syncOn ? 'on' : 'off'), style: { marginLeft: 'auto' } }, syncOn ? '已连接' : '未连接')
    ),
    el('div', { class: 'set-grid' },
      el('div', { class: 'set-label' }, 'GitHub Token：'),
      el('input', { type: 'password', id: 'set-token', placeholder: '粘贴你的 GitHub Personal Access Token（需 gist 权限）', value: SYNC.token, style: { gridColumn: '2 / 3' } })
    ),
    el('div', { class: 'set-actions' },
      el('button', { class: 'btn', onclick: saveToken }, '保存凭证'),
      el('button', { class: 'btn', onclick: manualSync }, '🔄 立即双向同步'),
      el('button', { class: 'btn-ghost', style: { padding: '9px 14px', borderRadius: '8px', border: '1px solid var(--border-strong)' }, onclick: () => gistSave(true) }, '上传到云端'),
      el('button', { class: 'btn-ghost', style: { padding: '9px 14px', borderRadius: '8px', border: '1px solid var(--border-strong)' }, onclick: () => gistLoad(true) }, '从云端下载'),
      el('button', { class: 'btn-ghost', style: { padding: '9px 14px', borderRadius: '8px', border: '1px solid var(--border-strong)' }, onclick: toggleAutoSync }, SYNC.auto ? '自动同步：开' : '自动同步：关')
    ),
    el('div', { class: 'hint' },
      '同步状态：',
      el('span', { class: 'sync-indicator', style: { display: 'inline-flex', alignItems: 'center', gap: '6px', marginLeft: '4px' } }),
      el('br', {}),
      '原理：数据集中存到你的 ', el('code', {}, 'GitHub Gist'), '，手机 / 电脑 / 平板打开同一网页并填入同一个 Token 即可共享。<br>',
      '新设备流程：在该设备粘贴 Token 后点「保存凭证」会自动发现并接入同一云端存储，无需拷贝 Gist ID。<br>',
      '同步策略：每次改动 1.2 秒后自动上传；同时后台每 30s 静默检查云端，<b>有新内容会自动拉取并提示</b>；切回页面 / 唤醒设备也会立即检查。<br>',
      '获取 Token：GitHub → Settings → Developer settings → Personal access tokens → Tokens (classic) → 勾选 ', el('code', {}, 'gist'), ' → 生成并复制。Token 仅保存在你本机浏览器。')
  );
  wrap.appendChild(c2);

  // 数据管理
  const c3 = el('div', { class: 'set-card' },
    el('div', { class: 'section-title' }, el('span', { class: 'ico' }, '💾'), el('span', {}, '数据管理')),
    el('div', { class: 'set-actions' },
      el('button', { class: 'btn', onclick: exportData }, '导出 JSON'),
      el('button', { class: 'btn-ghost', style: { padding: '9px 14px', borderRadius: '8px', border: '1px solid var(--border-strong)' }, onclick: importData }, '导入 JSON'),
      el('button', { class: 'btn-danger', style: { padding: '9px 14px', borderRadius: '8px', border: 'none' }, onclick: clearAllData }, '清空所有数据')
    ),
    el('div', { class: 'hint' },
      '数据存于浏览器 ', el('code', {}, 'localStorage'), '（', el('code', {}, 'j_workbench_v1'), '）。<br>',
      '• 导出 / 导入 JSON：在设备间手动备份与恢复。<br>',
      '• 清空数据：删除所有记录（不可恢复，请先导出）。')
  );
  wrap.appendChild(c3);

  // 统计
  const habitTotal = DB.habits.reduce((s,h)=>s + Object.keys(h.log || {}).length, 0);
  const habitDays = (() => {
    const set = new Set();
    DB.habits.forEach(h => Object.keys(h.log || {}).forEach(k => set.add(k)));
    return set.size;
  })();
  const stats = {
    '倒数日': DB.countdowns.length,
    '每日任务(总)': DB.tasks.length,
    '顺延中': DB.tasks.filter(t => t.carriedFrom).length,
    '快速捕记': DB.captures.length,
    '打卡总次数': habitTotal,
    '累计打卡天数': habitDays,
    '影视': DB.media.length,
    '复盘': DB.replay.length
  };
  wrap.appendChild(el('div', { class: 'set-card' },
    el('div', { class: 'section-title' }, el('span', { class: 'ico' }, '📈'), el('span', {}, '数据概览')),
    el('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(150px, 1fr))', gap: '10px', marginTop: '8px' } },
      ...Object.entries(stats).map(([k, v]) => el('div', { style: { background: 'var(--bg-3)', padding: '12px 14px', borderRadius: '10px', border: '1px solid var(--border)' } },
        el('div', { style: { fontSize: '20px', fontWeight: '700', color: 'var(--accent)' } }, v),
        el('div', { style: { fontSize: '11px', color: 'var(--text-2)' } }, k)))
    ),
    el('div', { class: 'hint', style: { marginTop: '12px' } },
      el('b', {}, '说明：'),
      el('br', {}),
      '· 「打卡总次数」= 所有习惯在所有天数打卡的累计次数（含同一日多习惯）。',
      el('br', {}),
      '· 「累计打卡天数」= 你在多少个不同的日期至少完成过一个习惯（更接近"坚持程度"）。',
      el('br', {}),
      '· 如果各设备上的数字不一致，是因为数据只存在该浏览器。进入「云端同步」连接后会自动一致。')
  ));
  return wrap;
}
async function saveToken() {
  SYNC.token = $('#set-token').value.trim();
  saveSyncCreds();
  if (SYNC.token) {
    // 自动发现云端：填入 token 后立刻去找现有 Gist，新设备无缝接入
    toast('正在连接云端…');
    const found = await gistFindExisting();
    if (found) {
      SYNC.gistId = found; saveSyncCreds();
      await gistLoad(true);
      toast('✓ 已找到现有云端存储并同步');
    } else {
      toast('凭证已保存，点「上传到云端」创建新存储');
    }
  } else {
    toast('凭证已清空');
  }
  render();
}
function toggleAutoSync() { SYNC.auto = !SYNC.auto; saveSyncCreds(); toast('自动同步已' + (SYNC.auto ? '开启' : '关闭')); render(); }
function exportData() {
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: `j-workbench-${todayKey()}.json` });
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 0);
  toast('已下载 JSON');
}
function importData() {
  const inp = el('input', { type: 'file', accept: '.json' });
  inp.onchange = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => { try {
      const data = JSON.parse(r.result);
      if (!data.profile) throw new Error('文件格式不正确');
      if (!confirm('导入会覆盖当前所有数据，确定继续？')) return;
      DB = { ...DEFAULT_DATA, ...data, profile: { ...DEFAULT_DATA.profile, ...(data.profile||{}) } };
      saveDB(); toast('导入成功'); render();
    } catch (err) { toast('导入失败：' + err.message); } };
    r.readAsText(file);
  };
  inp.click();
}
function clearAllData() {
  if (!confirm('⚠️ 确定清空所有数据？此操作不可恢复，建议先导出备份。')) return;
  if (!confirm('再次确认：真的要清空吗？')) return;
  DB = JSON.parse(JSON.stringify(DEFAULT_DATA)); saveDB(); toast('已清空'); render();
}

/* ===================== 通用 ===================== */
function pageHeader(icon, title, sub) {
  return el('div', {},
    el('div', { class: 'page-head' }, el('div', { class: 'big-icon' }, icon), el('h1', {}, title)),
    el('div', { class: 'page-sub' }, sub || '')
  );
}
function formRow(label, inputEl) { const w = el('div', { class: 'form-row' }); w.appendChild(el('label', {}, label)); w.appendChild(inputEl); return w; }
function button(text, opts = {}) {
  return el('button', { class: 'btn ' + (opts.class || 'btn-ghost'), style: { padding: '9px 16px', borderRadius: '8px', border: opts.class === 'btn-danger' ? 'none' : '1px solid var(--border-strong)', ...(opts.style||{}) }, onclick: opts.onclick }, text);
}
function input(attrs) { return el('input', { ...attrs, style: { ...(attrs.style||{}) } }); }
function openModal(title, build) {
  const mask = $('#modal'); const inner = $('#modal-inner'); inner.innerHTML = '';
  inner.appendChild(el('h3', {}, title));
  const content = el('div', {}); const actions = el('div', { class: 'modal-actions' });
  actions.appendChild(el('button', { class: 'btn-ghost', style: { padding: '9px 14px', borderRadius: '8px', border: '1px solid var(--border-strong)' }, onclick: closeModal }, '取消'));
  inner.appendChild(content); inner.appendChild(actions); mask.classList.add('show'); build(content, actions);
}
function closeModal() { $('#modal').classList.remove('show'); }
function deleteItem(key, id) {
  if (!confirm('确认删除？')) return;
  DB[key] = DB[key].filter(x => x.id !== id); saveDB(); toast('已删除'); render();
}

/* ===================== render ===================== */
function render() {
  const main = $('#main'); main.innerHTML = '';
  let node;
  switch (DB.page) {
    case 'home': node = renderHome(); break;
    case 'tasks': node = renderTasks(); break;
    case 'capture': node = renderCapture(); break;
    case 'countdown': node = renderCountdown(); break;
    case 'habit': node = renderHabit(); break;
    case 'news': node = renderNews(); break;
    case 'replay': node = renderReplay(); break;
    case 'media': node = renderMedia('all'); break;
    case 'settings': node = renderSettings(); break;
    default: node = renderHome();
  }
  main.appendChild(node);
  if (!['home','tasks','capture','countdown','habit','news','replay','media','settings'].includes(DB.page)) DB.page = 'home';
  updateNavActive();
  main.scrollTop = 0;
}

/* ===================== 启动 ===================== */
$('#nav').addEventListener('click', (e) => { const item = e.target.closest('.nav-item'); if (item) goto(item.dataset.page); });
$('#mobileNav').addEventListener('click', (e) => { const btn = e.target.closest('button'); if (btn) goto(btn.dataset.page); });
$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

render();
updateSyncBadge();

// 启动时若已开启自动同步且已连接云端，则拉取最新数据
if (SYNC.auto && SYNC.token) {
  (async () => {
    if (!SYNC.gistId) { const id = await gistFindExisting(); if (id) { SYNC.gistId = id; saveSyncCreds(); } }
    if (SYNC.gistId) { await gistLoad(false); render(); }
  })();
}

// 后台定期拉取（30s）：检测云端是否有新内容
setInterval(() => { if (SYNC.auto && SYNC.token && SYNC.gistId) gistPoll(); }, 30000);

// 切回页面 / 唤醒设备时立即检查一次
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && SYNC.token && SYNC.gistId) gistPoll();
});
window.addEventListener('focus', () => { if (SYNC.token && SYNC.gistId) gistPoll(); });
</script>

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
